# Portable defaults. The launcher supplies this machine's paths.
server:
  shutdown: graceful
  address: 127.0.0.1
  port: ${LOCAL_AI_BACKEND_PORT:5000}
spring:
  lifecycle:
    timeout-per-shutdown-phase: 180s
  application:
    name: local-ai-agent
  ai:
    mcp:
      server:
        name: local-ai-agent
        version: 1.1.0
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
local-ai:
  ollama:
    base-url: ${LOCAL_AI_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${LOCAL_AI_MODEL:qwen3:1.7b}
    timeout-seconds: 120
    context-length: 4096
    max-tokens: 768
    think: false
  assistant:
    max-tool-calls: 4
    max-rounds: 6
    timeout-seconds: 180
  # Optional legacy engine; excluded from the default startup.
  llamacpp:
    enabled: ${LOCAL_AI_LLAMACPP_ENABLED:false}
    base-url: ${LOCAL_AI_LLAMACPP_URL:http://127.0.0.1:8080}
    model: ${LOCAL_AI_LLAMACPP_MODEL:local-model}
    temperature: 0.7
    max-tokens: 768
    timeout-seconds: 120
  qq:
    cqhttp-url: ${LOCAL_AI_QQ_CQHTTP_URL:http://127.0.0.1:5700}
    official-api-base-url: ${LOCAL_AI_QQ_OFFICIAL_API_BASE_URL:https://api.sgroup.qq.com}
    bot-token: ${LOCAL_AI_QQ_BOT_TOKEN:}
    guild-id: ${LOCAL_AI_QQ_GUILD_ID:}
    channel-id: ${LOCAL_AI_QQ_CHANNEL_ID:}
    webhook-secret: ${LOCAL_AI_QQ_WEBHOOK_SECRET:}
    command-prefix: ${LOCAL_AI_QQ_COMMAND_PREFIX:/ai}
  feishu:
    webhook-url: ${LOCAL_AI_FEISHU_WEBHOOK_URL:}
    app-id: ${LOCAL_AI_FEISHU_APP_ID:}
    app-secret: ${LOCAL_AI_FEISHU_APP_SECRET:}
    verify-token: ${LOCAL_AI_FEISHU_VERIFY_TOKEN:}
  file:
    workspace-root: ${LOCAL_AI_WORKSPACE:${user.dir}}
    upload-dir: ${LOCAL_AI_WORKSPACE:${user.dir}}/uploads
    log-dir: ${LOCAL_AI_WORKSPACE:${user.dir}}/logs
  maven:
    executable: ${LOCAL_AI_MAVEN_EXECUTABLE:mvn.cmd}
  nodejs:
    executable: ${LOCAL_AI_NODE_EXECUTABLE:node}
    npm-executable: ${LOCAL_AI_NPM_EXECUTABLE:npm.cmd}
logging:
  level:
    root: INFO
    com.localai.agent: INFO
  file:
    name: ${LOCAL_AI_WORKSPACE:${user.dir}}/logs/agent.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
